<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">先理解科学问题，再设计科研图形。</title>
  <desc id="desc">深蓝色科研设计横幅，展示系统流程、定量图表、空间图像和多分图等科研视觉形式。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091525"/>
      <stop offset="0.58" stop-color="#10243A"/>
      <stop offset="1" stop-color="#0A1829"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27C4B5" stop-opacity=".24"/>
      <stop offset="1" stop-color="#27C4B5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8BA4BE" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020812" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1600" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="460" rx="24" fill="url(#grid)"/>
  <circle cx="690" cy="55" r="360" fill="url(#glow)"/>
  <path d="M0 385C250 330 430 475 700 398S1180 290 1600 380V460H0Z" fill="#071321" opacity=".42"/>

  <g font-family="Noto Sans SC,Microsoft YaHei,PingFang SC,Arial,sans-serif">
    <rect x="78" y="66" width="248" height="36" rx="18" fill="#173A4B" stroke="#2A7D7B" stroke-opacity=".8"/>
    <circle cx="99" cy="84" r="5" fill="#4AD6C5"/>
    <text x="116" y="90" fill="#9CE8DE" font-size="16" font-weight="700" letter-spacing="1">跨学科科研绘图智能技能</text>

    <text x="78" y="174" fill="#F5F8FC" font-size="58" font-weight="750" letter-spacing="-1">先理解科学问题，</text>
    <text x="78" y="244" fill="#F5F8FC" font-size="58" font-weight="750" letter-spacing="-1">再设计科研图形。</text>
    <text x="82" y="294" fill="#B8C8D8" font-size="22">将研究目的、方法与数据转化为清晰、</text>
    <text x="82" y="326" fill="#B8C8D8" font-size="22">可编辑、可用于学术投稿的科学图形。</text>

    <g font-size="15" font-weight="650">
      <rect x="80" y="366" width="144" height="34" rx="17" fill="#1A3448" stroke="#31536B"/>
      <text x="152" y="389" fill="#D9E8F5" text-anchor="middle">目的导向</text>
      <rect x="236" y="366" width="135" height="34" rx="17" fill="#1A3448" stroke="#31536B"/>
      <text x="303.5" y="389" fill="#D9E8F5" text-anchor="middle">可编辑</text>
      <rect x="383" y="366" width="151" height="34" rx="17" fill="#1A3448" stroke="#31536B"/>
      <text x="458.5" y="389" fill="#D9E8F5" text-anchor="middle">证据驱动</text>
      <rect x="546" y="366" width="170" height="34" rx="17" fill="#1A3448" stroke="#31536B"/>
      <text x="631" y="389" fill="#D9E8F5" text-anchor="middle">质量可检查</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="48" width="316" height="166" rx="18" fill="#13283D" stroke="#35506A"/>
    <rect x="1184" y="48" width="336" height="166" rx="18" fill="#13283D" stroke="#35506A"/>
    <rect x="850" y="232" width="316" height="166" rx="18" fill="#13283D" stroke="#35506A"/>
    <rect x="1184" y="232" width="336" height="166" rx="18" fill="#13283D" stroke="#35506A"/>
  </g>

  <g font-family="Noto Sans SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#8FA8BE">
