<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <title>IEEE hardware architecture diagram template</title>
  <desc>Editable left-to-right architecture template. Replace placeholder labels and connections with verified technical content.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#202A35"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202A35}
      .module{stroke:#202A35;stroke-width:2;rx:8}
      .wire{stroke:#202A35;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .sub{font-size:18px}
      .head{font-size:23px;font-weight:bold}
      .note{font-size:15px;fill:#667085}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="55" y="55" class="label head">Figure title / system name</text>
  <text x="55" y="83" class="label note">Replace all placeholders; verify every signal and bus width against the source design.</text>
  <rect x="55" y="205" width="180" height="105" fill="#F2F4F7" class="module"/>
  <text x="145" y="248" text-anchor="middle" class="label head">Input</text>
  <text x="145" y="278" text-anchor="middle" class="label sub">name / width</text>
  <path d="M235 258 H330" class="wire"/>
  <rect x="330" y="185" width="210" height="145" fill="#EAF2F8" class="module"/>
  <text x="435" y="235" text-anchor="middle" class="label head">Stage 1</text>
  <text x="435" y="267" text-anchor="middle" class="label sub">function</text>
  <text x="435" y="293" text-anchor="middle" class="label note">parameters / latency</text>
  <path d="M540 258 H640" class="wire"/>
  <rect x="640" y="185" width="210" height="145" fill="#E8F4F1" class="module"/>
  <text x="745" y="235" text-anchor="middle" class="label head">Stage 2</text>
  <text x="745" y="267" text-anchor="middle" class="label sub">function</text>
  <text x="745" y="293" text-anchor="middle" class="label note">parameters / latency</text>
  <path d="M850 258 H955" class="wire"/>
  <rect x="955" y="205" width="190" height="105" fill="#FFF2E3" class="module"/>
  <text x="1050" y="248" text-anchor="middle" class="label head">Output</text>
  <text x="1050" y="278" text-anchor="middle" class="label sub">name / width</text>
  <text x="55" y="410" class="label note">Optional grouping boundary / clock domain / subsystem</text>
  <rect x="55" y="430" width="1090" height="58" rx="6" fill="none" stroke="#98A2B3" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="80" y="466" class="label sub">Group label</text>
  <text x="55" y="530" class="label note">Template only — not a verified implementation. Use a separate signal legend when needed.</text>
</svg>
