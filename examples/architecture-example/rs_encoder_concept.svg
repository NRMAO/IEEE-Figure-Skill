<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <title>Conceptual systematic Reed-Solomon encoder</title>
  <desc>Original illustrative LFSR-style systematic RS encoder. Exact taps, field constants, and parallelism depend on the implementation.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#202A35"/>
    </marker>
    <marker id="tealarr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#238477"/>
    </marker>
    <style>
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#202A35}
      .box{stroke:#202A35;stroke-width:2;rx:8}
      .wire{stroke:#202A35;stroke-width:2.4;fill:none;marker-end:url(#arr)}
      .feedback{stroke:#238477;stroke-width:2.5;fill:none;marker-end:url(#tealarr)}
      .small{font-size:18px}
      .med{font-size:22px}
      .big{font-size:28px;font-weight:bold}
    </style>
  </defs>
  <rect width="1400" height="620" fill="#FFFFFF"/>
  <text x="55" y="55" class="txt big">Conceptual systematic RS encoder (LFSR-style)</text>
  <text x="55" y="88" class="txt small" fill="#667085">Illustrative architecture only — not derived from a particular RTL, generator polynomial, or parallel implementation.</text>

  <rect x="65" y="205" width="190" height="100" class="box" fill="#F2F4F7"/>
  <text x="160" y="246" class="txt med" text-anchor="middle">Message input</text>
  <text x="160" y="276" class="txt small" text-anchor="middle">m(x), k symbols</text>

  <circle cx="330" cy="255" r="6" fill="#202A35"/>
  <path d="M255 255 H330 H1090" class="wire"/>
  <text x="690" y="230" class="txt small" text-anchor="middle">Systematic data path</text>
  <rect x="1090" y="205" width="245" height="100" class="box" fill="#EAF2F8"/>
  <text x="1212" y="246" class="txt med" text-anchor="middle">Codeword output</text>
  <text x="1212" y="276" class="txt small" text-anchor="middle">data symbols + parity symbols</text>

  <path d="M330 255 V390 H455" class="wire"/>
  <text x="345" y="365" class="txt small">message symbol feed</text>

  <rect x="455" y="345" width="195" height="95" class="box" fill="#EAF2F8"/>
  <text x="552" y="385" class="txt med" text-anchor="middle">XOR network</text>
  <text x="552" y="414" class="txt small" text-anchor="middle">GF(2^m) addition</text>

  <path d="M650 392 H735" class="wire"/>
  <rect x="735" y="345" width="205" height="95" class="box" fill="#E8F4F1"/>
  <text x="837" y="385" class="txt med" text-anchor="middle">Parity registers</text>
  <text x="837" y="414" class="txt small" text-anchor="middle">state update</text>

  <path d="M940 392 H1090 V305" class="wire"/>
  <text x="1000" y="375" class="txt small">parity output</text>

  <path d="M837 440 V500 H650" class="feedback"/>
  <rect x="420" y="465" width="230" height="75" class="box" fill="#FFF2E3"/>
  <text x="535" y="495" class="txt med" text-anchor="middle">GF tap multipliers</text>
  <text x="535" y="520" class="txt small" text-anchor="middle">generator constants</text>
  <path d="M420 502 H365 V392 H455" class="feedback"/>
  <text x="275" y="490" class="txt small" fill="#238477">state feedback</text>

  <rect x="65" y="560" width="1270" height="42" rx="6" fill="#FFFFFF" stroke="#98A2B3" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text x="85" y="587" class="txt small">Specify RS(n,k), symbol width, generator polynomial, parallelism, register/tap ordering, and exact feedback equations before finalizing.</text>
</svg>
